plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'java'
}

version = '1.0.2'
group = 'recovered'

base {
    archivesName = 'intel-client'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.8:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.4+1.21.4'
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
    it.options.compilerArgs += ['-Xmaxerrs', '10000', '-Xdiags:verbose']
}

def optimizeTextures = tasks.register('optimizeTextures') {
    dependsOn tasks.named('processResources')
    doLast {
        def root = layout.buildDirectory.dir('resources/main/assets/systemdlc/images').get().asFile
        if (!root.exists()) return
        root.eachFileRecurse { file ->
            if (!file.isFile() || !file.name.toLowerCase().endsWith('.png')) return
            def image = javax.imageio.ImageIO.read(file)
            if (image == null) return
            def tmp = new File(file.parentFile, file.name + '.optimized')
            def writer = javax.imageio.ImageIO.getImageWritersByFormatName('png')
            if (!writer.hasNext()) return
            def pngWriter = writer.next()
            try {
                def params = pngWriter.getDefaultWriteParam()
                if (params.canWriteCompressed()) {
                    params.setCompressionMode(javax.imageio.ImageWriteParam.MODE_EXPLICIT)
                    params.setCompressionQuality(0.8f)
                }
                pngWriter.setOutput(javax.imageio.ImageIO.createImageOutputStream(tmp))
                pngWriter.write(null, new javax.imageio.IIOImage(image, null, null), params)
            } finally {
                pngWriter.dispose()
            }
            if (tmp.length() < file.length()) {
                file.delete()
                tmp.renameTo(file)
            } else {
                tmp.delete()
            }
        }
    }
}

tasks.named('jar') {
    dependsOn optimizeTextures
    archiveFileName = 'intel-client-1.0.2.jar'
}

tasks.named('remapJar') {
    dependsOn optimizeTextures
    archiveFileName = 'SystemDLC-1.0.1.jar'
}

tasks.named('runClient') {
    jvmArgs '-Dsystemdlc.native=true', '--enable-native-access=ALL-UNNAMED',
            '--add-opens', 'jdk.attach/com.sun.tools.attach=ALL-UNNAMED'
}
