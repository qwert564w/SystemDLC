name: Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew || true
          if [ -f ./gradlew ]; then ./gradlew build --no-daemon --stacktrace; else gradle build --no-daemon --stacktrace; fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: intel-client
          path: build/libs/*.jar
