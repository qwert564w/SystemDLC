name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
      
    - name: Get version
      id: version
      run: |
        VER=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '"' || echo '1.0.0')
        echo "version=$VER" >> $GITHUB_OUTPUT
        echo "Version found: $VER"
        
    - name: Create Release and Upload JAR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v${{ steps.version.outputs.version }}"
        UNIQUE_TAG="${TAG}-build${{ github.run_number }}"
        
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$UNIQUE_TAG"
        git push origin "$UNIQUE_TAG"
        
        gh release create "$UNIQUE_TAG" \
          --title "SystemDLC Release $UNIQUE_TAG" \
          --notes "Автоматическая сборка SystemDLC для Minecraft 1.21.4. Собрано с помощью GitHub Actions." \
          build/libs/*.jar
