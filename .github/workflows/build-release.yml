name: Build intel client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build full JAR
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon clean build 2>&1 | tee build.log
          status=$PIPESTATUS
          exit $status
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-client-build-log
          path: build.log
          if-no-files-found: warn
      - name: Inspect JAR
        if: always()
        run: |
          find build/libs -maxdepth 1 -type f -printf "%f %s bytes\n" | tee jar-list.txt
          if test -f build/libs/intel-client-1.1.0.jar; then jar tf build/libs/intel-client-1.1.0.jar > jar-contents.txt; fi
      - name: Upload JAR inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-client-jar-inspection
          path: |
            jar-list.txt
            jar-contents.txt
          if-no-files-found: warn
      - name: Verify JAR
        run: |
          test -f build/libs/intel-client-1.1.0.jar
          unzip -t build/libs/intel-client-1.1.0.jar >/dev/null
          jar tf build/libs/intel-client-1.1.0.jar | grep -q 'fabric.mod.json'
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: intel-client-1.1.0
          path: build/libs/intel-client-1.1.0.jar
          if-no-files-found: error
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.1.0-intel-client --yes --cleanup-tag || true
          gh release create v1.1.0-intel-client build/libs/intel-client-1.1.0.jar \
            --target "${{ github.sha }}" \
            --title "intel client 1.1.0" \
            --notes "Fabric 1.21.11 migration and build fixes."
      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.0-intel-client
          gh release download v1.1.0-intel-client --pattern 'intel-client-1.1.0.jar' --dir /tmp/release-check
          test -s /tmp/release-check/intel-client-1.1.0.jar
