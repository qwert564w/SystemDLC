name: Build intel client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build full JAR
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon clean build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-client-build-log
          path: build.log
          if-no-files-found: warn
      - name: Inspect JAR
        if: always()
        run: |
          find build/libs -maxdepth 1 -type f -printf "%f %s bytes\n" | tee jar-list.txt
          if test -f build/libs/intel-client-1.1.1.jar; then jar tf build/libs/intel-client-1.1.1.jar > jar-contents.txt; fi
      - name: Upload JAR inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-client-jar-inspection
          path: |
            jar-list.txt
            jar-contents.txt
          if-no-files-found: warn
      - name: Verify JAR
        run: |
          find build/libs -maxdepth 1 -type f -printf "%f %s bytes\n"
          test -s build/libs/intel-client-1.1.1.jar
          unzip -t build/libs/intel-client-1.1.1.jar >/dev/null
          jar tf build/libs/intel-client-1.1.1.jar | grep -q 'fabric.mod.json'
          echo "JAR verified: $(du -h build/libs/intel-client-1.1.1.jar | cut -f1)"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: intel-client-1.1.1
          path: build/libs/intel-client-1.1.1.jar
          if-no-files-found: error
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.1.1-intel-client --yes --cleanup-tag || true
          gh release create v1.1.1-intel-client build/libs/intel-client-1.1.1.jar --target "${{ github.sha }}" --title "intel client 1.1.1 — Minecraft 1.21.11" --notes "Minecraft 1.21.11/Fabric port, compile fixes, GUI polish, and optimized rendering resources."
      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.1-intel-client
          gh release download v1.1.1-intel-client --pattern 'intel-client-1.1.1.jar' --dir /tmp/release-check
          test -s /tmp/release-check/intel-client-1.1.1.jar
