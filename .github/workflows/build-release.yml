name: Build intel client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build full JAR
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-client-build-log
          path: build.log
          if-no-files-found: warn

      - name: Inspect JAR
        if: always()
        run: |
          find build/libs -maxdepth 1 -type f -printf "%f %s bytes\n" | tee jar-list.txt || true
          JAR=$(ls build/libs/intel-client-*.jar 2>/dev/null | head -1)
          if [ -n "$JAR" ]; then jar tf "$JAR" > jar-contents.txt; fi

      - name: Upload JAR inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-client-jar-inspection
          path: |
            jar-list.txt
            jar-contents.txt
          if-no-files-found: warn

      - name: Verify JAR
        run: |
          JAR=$(ls build/libs/intel-client-*.jar | head -1)
          echo "Found: $JAR"
          test -s "$JAR"
          unzip -t "$JAR" >/dev/null
          jar tf "$JAR" | grep -q 'fabric.mod.json'
          echo "JAR verified: $(du -h "$JAR" | cut -f1)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: intel-client-1.21.11
          path: build/libs/intel-client-*.jar
          if-no-files-found: error

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/intel-client-*.jar | head -1)
          TAG="v1.1.2-1.21.11"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$JAR" \
            --target "${{ github.sha }}" \
            --title "intel client 1.1.2 — Minecraft 1.21.11" \
            --notes "Fabric 1.21.11 port. KillAura removed. TriggerBot/AimAssist as primary combat. Clean build without gradle cache."
