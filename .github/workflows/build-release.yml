name: Build intel client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build full JAR
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon clean build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-client-build-log
          path: build.log
          if-no-files-found: warn

      - name: Inspect JAR
        if: always()
        run: |
          find build/libs -maxdepth 1 -type f -printf "%f %s bytes\n" | tee jar-list.txt
          if test -f build/libs/intel-client-1.0.2.jar; then jar tf build/libs/intel-client-1.0.2.jar > jar-contents.txt; fi
      - name: Upload JAR inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-client-jar-inspection
          path: |
            jar-list.txt
            jar-contents.txt
          if-no-files-found: warn

      - name: Verify JAR
        run: |
          echo "Artifacts:"
          find build/libs -maxdepth 1 -type f -printf "%f %s bytes\n"
          test -f build/libs/intel-client-1.0.2.jar
          unzip -t build/libs/intel-client-1.0.2.jar >/dev/null
          echo "JAR verified: $(du -h build/libs/intel-client-1.0.2.jar | cut -f1)"
          jar tf build/libs/intel-client-1.0.2.jar | grep -q 'fabric.mod.json'
          jar tf build/libs/intel-client-1.0.2.jar | grep -q 'assets/systemdlc/shaders/core/motion_blur.fsh'
          jar tf build/libs/intel-client-1.0.2.jar | grep -q 'assets/systemdlc/images/a.png'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: intel-client-1.0.2
          path: build/libs/intel-client-1.0.2.jar
          if-no-files-found: error

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.2-intel-client --yes --cleanup-tag || true
          gh release create v1.0.2-intel-client build/libs/intel-client-1.0.2.jar             --target "${{ github.sha }}"             --title "intel client 1.0.2"             --notes "Optimized full-project build with updated rotation logic, shader performance reductions, and resource texture recompression."


      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.2-intel-client
          gh release download v1.0.2-intel-client --pattern 'intel-client-1.0.2.jar' --dir /tmp/release-check
          test -s /tmp/release-check/intel-client-1.0.2.jar
